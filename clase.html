<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clase | Duvna Academy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/duvna.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <div class="player">
    <nav class="player-nav" aria-label="Clases del curso">
      <h2 id="course-title">Curso</h2>
      <div id="outline"></div>
    </nav>

    <main class="player-main">
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <article id="lesson" class="lesson-body lesson-protected"></article>
      <div class="lesson-actions" id="actions" hidden>
        <button class="btn btn-ghost" id="toggle-done" type="button">Marcar como completada</button>
        <a class="btn btn-primary" id="next" href="#">Siguiente clase</a>
      </div>
    </main>
  </div>

  <script type="module">
    import { supabase, CONFIG, requireBackend, requireSession, esc, showMsg } from "./assets/js/app.js";

    const msg = document.getElementById("msg");
    const lessonEl = document.getElementById("lesson");
    if (!requireBackend(msg)) throw new Error("Sin backend");
    const session = await requireSession();
    if (!session) throw new Error("Sin sesión");

    const params = new URLSearchParams(location.search);
    const courseId = params.get("curso");
    const info = CONFIG.CURSOS[courseId];
    if (!info) { showMsg(msg, "err", "Ese curso no existe."); throw new Error("curso"); }
    document.getElementById("course-title").textContent = info.titulo;

    const [{ data: outline }, { data: progress }] = await Promise.all([
      supabase.rpc("course_outline", { p_course: courseId }),
      supabase.from("progress").select("lesson_id")
    ]);
    const done = new Set((progress || []).map(p => p.lesson_id));
    const lessonId = params.get("clase") || outline?.[0]?.id;

    // ---- Índice lateral ----
    let html = "", lastMod = null;
    for (const l of outline || []) {
      if (l.module_no !== lastMod) {
        html += `<div class="mod">Módulo ${l.module_no}: ${esc(l.module_title)}</div>`;
        lastMod = l.module_no;
      }
      const cls = [done.has(l.id) ? "done" : ""].join(" ");
      html += `<a class="${cls}" href="clase.html?curso=${courseId}&clase=${l.id}" ${l.id === lessonId ? 'aria-current="page"' : ""}>${esc(l.title)}${l.is_preview ? ' <span class="small muted">(muestra)</span>' : ""}</a>`;
    }
    document.getElementById("outline").innerHTML = html || `<p class="small muted" style="padding:0 20px">Las clases se están cargando al curso.</p>`;

    // ---- Contenido de la clase (el servidor solo lo entrega si hay acceso) ----
    const { data: lesson } = await supabase.from("lessons").select("*").eq("id", lessonId).maybeSingle();

    if (!lesson) {
      const meta = (outline || []).find(l => l.id === lessonId);
      lessonEl.classList.remove("lesson-protected");
      lessonEl.innerHTML = `<div class="locked">
        <span class="pill">Clase del curso completo</span>
        <h1 style="margin-top:16px">${esc(meta?.title || "Clase")}</h1>
        <p class="muted">Para ver esta clase y el resto del curso necesitás una suscripción activa. Tenés 10 días de garantía y te das de baja con un clic.</p>
        <p style="margin:0">${info.checkoutUrl
          ? `<a class="btn btn-primary btn-lg" href="panel.html?comprar=${courseId}">Suscribirme por ${esc(info.precio)} ${esc(info.periodo)}</a>`
          : `<span class="muted">Las inscripciones abren muy pronto. Mientras tanto podés hacer la clase de muestra.</span>`}</p></div>`;
      throw new Error("sin acceso");
    }

    document.title = `${lesson.title} | Duvna Academy`;
    let videoHtml = "";
    if (lesson.video_path) {
      // Enlace temporal: vence en 2 horas y solo se genera si el servidor confirma el acceso.
      const { data: signed } = await supabase.storage.from("lecciones").createSignedUrl(lesson.video_path, 7200);
      if (signed?.signedUrl) {
        videoHtml = `<div class="video-wrap" id="video-wrap">
          <video src="${esc(signed.signedUrl)}" controls controlslist="nodownload noplaybackrate" disablepictureinpicture preload="metadata"></video>
          <span class="watermark" id="wm"></span></div>`;
      }
    }
    const body = DOMPurify.sanitize(marked.parse(lesson.body_md || ""));
    lessonEl.innerHTML = `
      <p class="small muted" style="margin:0">Módulo ${lesson.module_no}: ${esc(lesson.module_title)}</p>
      <h1 >${esc(lesson.title)}</h1>
      ${videoHtml}
      ${body}`;

    // ---- Protección: marca de agua con el email del alumno ----
    const wm = document.getElementById("wm");
    if (wm) {
      wm.textContent = session.user.email;
      const move = () => { wm.style.top = (8 + Math.random() * 78) + "%"; wm.style.left = (4 + Math.random() * 60) + "%"; };
      move(); setInterval(move, 15000);
    }
    lessonEl.addEventListener("contextmenu", (e) => { if (!e.target.closest("pre")) e.preventDefault(); });

    // ---- Completar y avanzar ----
    const idx = (outline || []).findIndex(l => l.id === lesson.id);
    const next = outline?.[idx + 1];
    const actions = document.getElementById("actions");
    const toggle = document.getElementById("toggle-done");
    const nextBtn = document.getElementById("next");
    actions.hidden = false;
    if (next) nextBtn.href = `clase.html?curso=${courseId}&clase=${next.id}`;
    else { nextBtn.textContent = "Volver al panel"; nextBtn.href = "panel.html"; }

    const paint = () => { toggle.textContent = done.has(lesson.id) ? "Completada ✓" : "Marcar como completada"; };
    paint();
    toggle.addEventListener("click", async () => {
      toggle.disabled = true;
      if (done.has(lesson.id)) {
        await supabase.from("progress").delete().eq("lesson_id", lesson.id).eq("user_id", session.user.id);
        done.delete(lesson.id);
      } else {
        const { error } = await supabase.from("progress").insert({ user_id: session.user.id, lesson_id: lesson.id });
        if (error) showMsg(msg, "err", "No se pudo guardar tu progreso. Probá de nuevo.");
        else done.add(lesson.id);
      }
      toggle.disabled = false; paint();
      document.querySelector(`.player-nav a[aria-current="page"]`)?.classList.toggle("done", done.has(lesson.id));
    });
  </script>
</body>
</html>
