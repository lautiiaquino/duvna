<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula | Duvna Academy</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/duvna.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <div class="player">
    <nav class="player-nav" aria-label="Clases del curso">
      <h2>Programación de juegos en Roblox con Luau</h2>
      <div class="aula-progreso">
        <div class="progress" aria-hidden="true"><span id="barra" style="width:0%"></span></div>
        <p class="small muted" id="progreso-texto">Cargando…</p>
      </div>
      <div id="indice"></div>
      <p style="padding:16px 22px 0" id="cert-link" hidden><a class="btn btn-primary btn-sm btn-block" href="certificado.html">Obtener mi certificado</a></p>
      <p class="small" style="padding:18px 22px 0" id="sesion"></p>
    </nav>

    <main class="player-main">
      <div id="aviso-muestra" class="aula-muestra" hidden>
        <div>
          <b>Estás viendo la clase de muestra.</b>
          <span class="muted">Las otras 40 clases se habilitan con tu código de acceso.</span>
        </div>
        <div class="aula-muestra-acciones">
          <a class="btn btn-primary btn-sm" data-buy="roblox-luau" href="cursos/roblox-luau.html#precio">Inscribirme</a>
          <a class="btn btn-ghost btn-sm" href="acceso.html">Tengo un código</a>
        </div>
      </div>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <article id="leccion" class="lesson-body lesson-protected"></article>
      <span class="aula-marca" id="marca" aria-hidden="true"></span>

      <div class="lesson-actions" id="acciones" hidden>
        <a class="btn btn-ghost" id="anterior" href="#">Clase anterior</a>
        <button class="btn btn-ghost" id="hecho" type="button">Marcar como completada</button>
        <a class="btn btn-primary" id="siguiente" href="#">Siguiente clase</a>
      </div>
    </main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module">
    import { esc, showMsg } from "./assets/js/app.js";
    import { cargarIndice, cargarMuestra, abrirCurso, accesoGuardado, cerrarSesion, progreso, marcar } from "./assets/js/aula.js";

    const leccion = document.getElementById("leccion");
    const msg = document.getElementById("msg");
    const acceso = accesoGuardado();

    const indice = await cargarIndice();
    const lista = indice.unidades.flatMap(u => u.clases.map(c => ({ ...c, unidad: u })));

    // Con código: se abre el curso completo. Sin código: solo la muestra.
    let clases = null;
    if (acceso?.codigo) {
      try {
        clases = await abrirCurso(acceso.codigo);
      } catch {
        cerrarSesion();
        showMsg(msg, "err", "Tu código de acceso ya no es válido. Volvé a ingresar con el código actual.");
      }
    }
    const completo = !!clases;
    if (!completo) {
      const muestra = await cargarMuestra();
      clases = { [muestra.id]: muestra.html };
      document.getElementById("aviso-muestra").hidden = false;
    }

    const sesion = document.getElementById("sesion");
    if (completo) {
      sesion.innerHTML = `Hola, ${esc(acceso.nombre)}. <a href="#" id="salir">Cerrar sesión</a>`;
      document.getElementById("salir").onclick = (e) => { e.preventDefault(); cerrarSesion(); location.href = "aula.html"; };
      document.getElementById("marca").textContent = `Material de ${acceso.nombre}. Duvna Academy`;
    } else {
      sesion.innerHTML = `<a href="acceso.html">Ingresar con mi código</a>`;
    }

    function pintarIndice(actual) {
      const hechas = progreso();
      let html = "";
      for (const u of indice.unidades) {
        html += `<div class="mod">Unidad ${u.num}: ${esc(u.titulo)}</div>`;
        for (const c of u.clases) {
          const abierta = !!clases[c.id];
          const cls = [hechas.has(c.id) && abierta ? "done" : "", abierta ? "" : "bloqueada"].join(" ").trim();
          html += `<a class="${cls}" href="#${c.id}" ${c.id === actual ? 'aria-current="page"' : ""}>`
            + `${abierta ? "" : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'}`
            + `<span>${c.id.replace("-", ".")} ${esc(c.titulo)}</span></a>`;
        }
      }
      document.getElementById("indice").innerHTML = html;
      const total = completo ? lista.length : 1;
      const n = lista.filter(c => clases[c.id] && hechas.has(c.id)).length;
      document.getElementById("barra").style.width = `${Math.round((n / total) * 100)}%`;
      document.getElementById("cert-link").hidden = !(completo && n === total);
      document.getElementById("progreso-texto").textContent = completo
        ? `${n} de ${total} clases completadas`
        : "Clase de muestra gratis";
    }

    function mostrar(id) {
      if (!lista.some(c => c.id === id)) id = indice.muestra;
      const pos = lista.findIndex(c => c.id === id);
      const clase = lista[pos];
      const html = clases[id];
      pintarIndice(id);
      document.title = `${clase.titulo} | Duvna Academy`;

      if (!html) {
        leccion.classList.remove("lesson-protected");
        leccion.innerHTML = `<div class="locked">
          <p class="small muted" style="margin:0">Unidad ${clase.unidad.num}: ${esc(clase.unidad.titulo)}</p>
          <h1 style="margin-top:10px">${esc(clase.titulo)}</h1>
          <p class="muted">Esta clase es parte del curso completo. Inscribite para recibir tu código de acceso y desbloquear las 41 clases.</p>
          <p style="display:flex;flex-wrap:wrap;gap:10px;margin:0">
            <a class="btn btn-primary" data-buy="roblox-luau" href="cursos/roblox-luau.html#precio">Inscribirme</a>
            <a class="btn btn-ghost" href="acceso.html">Tengo un código</a>
          </p></div>`;
        document.getElementById("acciones").hidden = true;
        refrescarBotonesCompra();
        window.scrollTo(0, 0);
        return;
      }

      leccion.classList.add("lesson-protected");
      leccion.innerHTML = `<p class="small muted" style="margin:0">Unidad ${clase.unidad.num}: ${esc(clase.unidad.titulo)}</p>
        <h1>Clase ${id.replace("-", ".")}: ${esc(clase.titulo)}</h1>${html}`;

      const acciones = document.getElementById("acciones");
      acciones.hidden = false;
      const ant = lista[pos - 1], sig = lista[pos + 1];
      const aAnt = document.getElementById("anterior");
      const aSig = document.getElementById("siguiente");
      aAnt.style.visibility = ant ? "visible" : "hidden";
      if (ant) aAnt.href = `#${ant.id}`;
      if (sig && !completo) { aSig.href = `inscripcion.html?curso=roblox-luau`; aSig.textContent = "Quiero el curso completo"; }
      else if (sig) { aSig.href = `#${sig.id}`; aSig.textContent = "Siguiente clase"; }
      else { aSig.href = "certificado.html"; aSig.textContent = "Ver mi certificado"; }

      leccion.querySelectorAll(".hl").forEach(bloque => {
        const copiar = document.createElement("button");
        copiar.type = "button";
        copiar.className = "copiar";
        copiar.textContent = "Copiar";
        copiar.onclick = async () => {
          const texto = bloque.querySelector("pre").innerText;
          try { await navigator.clipboard.writeText(texto); copiar.textContent = "Copiado"; }
          catch { copiar.textContent = "Seleccioná y copiá"; }
          setTimeout(() => (copiar.textContent = "Copiar"), 1800);
        };
        bloque.appendChild(copiar);
      });
      if (completo) { try { localStorage.setItem("duvna_ultima", id); } catch {} }

      const boton = document.getElementById("hecho");
      const pintar = () => { boton.textContent = progreso().has(id) ? "Completada ✓" : "Marcar como completada"; };
      pintar();
      boton.onclick = () => { marcar(id, !progreso().has(id)); pintar(); pintarIndice(id); };
      window.scrollTo(0, 0);
    }

    // Los botones de compra que se agregan después necesitan su destino real
    function refrescarBotonesCompra() {
      const original = document.querySelector('.aula-muestra [data-buy]');
      document.querySelectorAll('.locked [data-buy]').forEach(b => { if (original) b.href = original.href; });
    }

    leccion.addEventListener("contextmenu", (e) => { if (!e.target.closest("pre")) e.preventDefault(); });
    window.addEventListener("hashchange", () => mostrar(location.hash.slice(1)));
    const ultima = (() => { try { return localStorage.getItem("duvna_ultima"); } catch { return null; } })();
    mostrar(location.hash.slice(1) || (completo && ultima) || indice.muestra);
  </script>
</body>
</html>
