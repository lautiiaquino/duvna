<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar certificado | Duvna Academy</title>
  <meta name="description" content="Comprobá si un certificado de Duvna Academy es válido usando su código.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/duvna.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="form-page">
    <div class="wrap">
      <div class="form-card wide">
        <h1 >Verificar un certificado</h1>
        <p class="muted">Ingresá el código que figura en el certificado, por ejemplo DUV-7F3A-91C2.</p>
        <form id="form" novalidate>
          <div class="field">
            <label for="code">Código del certificado</label>
            <input id="code" type="text" autocomplete="off" spellcheck="false" style="font-family:var(--mono);text-transform:uppercase" maxlength="20">
          </div>
          <button class="btn btn-dark" type="submit">Verificar</button>
        </form>
        <div id="msg" class="msg" role="status" aria-live="polite" style="margin-top:20px"></div>
        <div id="result"></div>
      </div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module">
    import { supabase, requireBackend, esc, fmtDate, showMsg } from "./assets/js/app.js";
    const msg = document.getElementById("msg");
    const input = document.getElementById("code");
    const result = document.getElementById("result");
    const ready = requireBackend(msg);

    async function check(code) {
      result.innerHTML = ""; msg.className = "msg"; msg.textContent = "";
      code = code.trim().toUpperCase();
      if (!/^DUV-[0-9A-F]{4}-[0-9A-F]{4}$/.test(code)) return showMsg(msg, "err", "El código tiene el formato DUV-XXXX-XXXX. Revisá que esté completo.");
      if (!ready) return;
      const { data, error } = await supabase.rpc("verify_certificate", { p_code: code });
      if (error) return showMsg(msg, "err", "No pudimos consultar el certificado. Probá de nuevo en unos minutos.");
      if (!data?.length) return showMsg(msg, "err", `No existe ningún certificado con el código ${code}.`);
      const c = data[0];
      showMsg(msg, "ok", "Certificado válido.");
      result.innerHTML = `<dl class="kv">
        <dt>Alumno</dt><dd>${esc(c.full_name)}</dd>
        <dt>Curso</dt><dd>${esc(c.course_title)}</dd>
        <dt>Emitido</dt><dd>${fmtDate(c.issued_at)}</dd>
        <dt>Código</dt><dd style="font-family:var(--mono)">${esc(code)}</dd></dl>
        <p class="small muted" style="margin-top:16px">Certificado privado de finalización emitido por Duvna Academy. No es un título oficial.</p>`;
      history.replaceState(null, "", `?codigo=${code}`);
    }

    document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); check(input.value); });
    const pre = new URLSearchParams(location.search).get("codigo");
    if (pre) { input.value = pre; check(pre); }
  </script>
</body>
</html>
