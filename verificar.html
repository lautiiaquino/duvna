<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar certificado | Duvna Academy</title>
  <meta name="description" content="Comprobá si un certificado de Duvna Academy es válido con su código.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/duvna.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="form-page">
    <div class="wrap">
      <div class="form-intro">
        <h1>Verificar un certificado</h1>
        <p>Escribí el código que figura abajo a la derecha del certificado.</p>
      </div>
      <form class="form-card" id="form" novalidate>
        <div class="field">
          <label for="code">Código del certificado</label>
          <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DUV-XXXX-XXXX" maxlength="20" style="font-family:var(--mono);text-transform:uppercase">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Verificar</button>
        <div id="msg" class="msg" role="status" aria-live="polite" style="margin:20px 0 0"></div>
        <div id="result"></div>
      </form>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module">
    import { esc, showMsg, requireBackend } from "./assets/js/app.js";
    import { verificarCertificado } from "./assets/js/aula.js";

    const msg = document.getElementById("msg");
    const input = document.getElementById("code");
    const result = document.getElementById("result");

    async function verificar(codigo) {
      result.innerHTML = "";
      codigo = codigo.trim().toUpperCase();
      if (!requireBackend(msg)) return;
      if (!/^DUV-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(codigo)) return showMsg(msg, "err", "El código tiene la forma DUV-XXXX-XXXX. Revisá que esté completo.");
      let c = null;
      try { c = await verificarCertificado(codigo); } catch { return showMsg(msg, "err", "No pudimos consultar el certificado. Probá de nuevo en unos minutos."); }
      if (!c) return showMsg(msg, "err", `No existe ningún certificado con el código ${codigo}.`);
      showMsg(msg, "ok", "Certificado válido.");
      const fecha = new Date(c.issued_at).toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
      result.innerHTML = `<dl class="kv" style="margin-top:16px">
        <dt>Alumno</dt><dd>${esc(c.full_name)}</dd>
        <dt>Curso</dt><dd>${esc(c.course_title)}</dd>
        <dt>Emitido</dt><dd>${fecha}</dd>
        <dt>Código</dt><dd style="font-family:var(--mono)">${esc(codigo)}</dd></dl>
        <p class="small muted" style="margin-top:14px">Certificado privado de finalización emitido por Duvna Academy. No es un título oficial.</p>`;
      history.replaceState(null, "", `?codigo=${codigo}`);
    }

    document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); verificar(input.value); });
    const inicial = new URLSearchParams(location.search).get("codigo");
    if (inicial) { input.value = inicial; verificar(inicial); }
  </script>
</body>
</html>
